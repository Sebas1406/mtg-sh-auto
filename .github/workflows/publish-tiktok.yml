name: Publish TikTok Queue

on:
  workflow_dispatch:
    inputs:
      report_id:
        description: "Optional report id to publish"
        required: false
        type: string
  workflow_run:
    workflows: ["Deploy Pages From Local Assets"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: publish-tiktok-queue
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      REPORT_ID: ${{ github.event.inputs.report_id }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ vars.TIKTOK_REDIRECT_URI }}
      TIKTOK_LOCAL_CALLBACK_URL: ${{ vars.TIKTOK_LOCAL_CALLBACK_URL || 'http://127.0.0.1:8765/auth/tiktok/local-callback' }}
      TIKTOK_SCOPES: ${{ vars.TIKTOK_SCOPES || 'video.publish,video.upload' }}
      TIKTOK_VERIFY_PREFIX: ${{ vars.TIKTOK_VERIFY_PREFIX }}
      TIKTOK_MEDIA_BASE_URL: ${{ vars.TIKTOK_MEDIA_BASE_URL }}
      TIKTOK_TOKEN_JSON: ${{ secrets.TIKTOK_TOKEN_JSON }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TOKEN_STORE_PATH: .secrets/tiktok_tokens.json
    steps:
      - name: Checkout workflow_run commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout selected branch
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tiktok.txt
          python -m pip install Pillow

      - name: Validate prepared publish bundle
        run: |
          if [ -n "$REPORT_ID" ]; then
            python automation/verify_publish_bundle.py "$REPORT_ID"
          else
            python automation/verify_publish_bundle.py
          fi

      - name: Publish latest ready queue item
        run: |
          if [ -n "$REPORT_ID" ]; then
            python automation/publish_ready_queue_item.py "$REPORT_ID"
          else
            python automation/publish_ready_queue_item.py
          fi

      - name: Upload publish run artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish-run
          path: publish_runs/*.json
